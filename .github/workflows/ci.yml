name: CI - Quality, Security and Supply Chain

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de desenvolvimento e seguranca
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,security]"

      - name: Ruff - erros criticos e nomes indefinidos
        run: ruff check app tests scripts

      - name: Bandit - severidade media/alta
        run: bandit -q -r app -ll

      - name: Testes + coverage gate
        run: |
          pytest -q tests \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=25

      - name: Dependency audit
        run: pip-audit . --strict --progress-spinner off

      - name: Gerar SBOM CycloneDX
        run: |
          mkdir -p artifacts
          cyclonedx-py environment \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --output-file artifacts/sbom-python.cdx.json

      - name: Publicar coverage e SBOM
        uses: actions/upload-artifact@v7
        with:
          name: quality-supply-chain-artifacts
          path: |
            coverage.xml
            artifacts/sbom-python.cdx.json
          retention-days: 14

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com historico completo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-gate:
    name: Container Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build imagem production
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: ai-sales-agent-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar usuario nao-root
        run: |
          test "$(docker image inspect ai-sales-agent-platform:ci --format '{{.Config.User}}')" = "app"

      - name: Trivy - gate CRITICAL corrigivel
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-sales-agent-platform:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy - relatorio HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-sales-agent-platform:ci
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Publicar relatorio Trivy
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report
          path: trivy-image.sarif
          retention-days: 14

  integration-gate:
    name: Docker Integration Gate
    runs-on: ubuntu-latest
    needs: [quality-gate, secret-scan, container-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preparar ambiente mock seguro
        run: cp .env.example .env

      - name: Subir stack base
        run: docker compose up -d --build postgres redis api

      - name: Aguardar readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ready | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=200 api
          exit 1

      - name: Regressao completa no container
        run: docker compose exec -T api pytest -q tests

      - name: Smoke de resiliencia sem custo OpenAI
        run: docker compose exec -T api python -m scripts.test_v13_resilience

      - name: Estado final
        if: always()
        run: docker compose ps

      - name: Cleanup sem remover volumes do projeto do usuario
        if: always()
        run: docker compose down --remove-orphans
