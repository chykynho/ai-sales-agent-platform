name: CD - Release Container

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release-container:
    name: Build, Scan and Publish GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: QEMU
        uses: docker/setup-qemu-action@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local amd64 para security gate
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: false
          load: true
          tags: ai-sales-agent-platform:release-candidate

      - name: Trivy - bloquear CRITICAL corrigivel
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-sales-agent-platform:release-candidate
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata da imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Publicar imagem multi-platform com provenance e SBOM
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar manifest multi-platform publicado
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}"
          docker buildx imagetools inspect --raw "$image" > /tmp/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/manifest.json").read_text(encoding="utf-8"))
          platforms = {
              (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture"))
              for item in data.get("manifests", [])
          }
          required = {("linux", "amd64"), ("linux", "arm64")}
          missing = required - platforms
          if missing:
              raise SystemExit(f"Manifest multi-platform incompleto: {sorted(missing)}")
          print(f"Manifest multi-platform validado: {sorted(required)}")
          PY
