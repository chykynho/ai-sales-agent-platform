name: CD - Release Container

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release-container:
    name: Build, Scan and Publish GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local para security gate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: ai-sales-agent-platform:release-candidate

      - name: Trivy - bloquear CRITICAL corrigivel
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-sales-agent-platform:release-candidate
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata da imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Publicar imagem com provenance e SBOM
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
