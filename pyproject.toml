[project]
name = "ai-sales-agent-platform"
version = "0.12.0"
description = "Production-oriented multi-tenant AI Sales Agent Platform - v0.12 Observability and SRE"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy[asyncio]==2.0.52",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.15,<2.0",
  "redis>=8,<9",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3",
  "openai==3.6.0",
  "httpx>=0.28,<1",
  "websocket-client>=1.8,<2",
  "twilio==9.11.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pgvector==0.5.0",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "prometheus-client==0.26.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-instrumentation-httpx==0.65b0",
  "opentelemetry-instrumentation-redis==0.65b0",
  "opentelemetry-instrumentation-sqlalchemy==0.65b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
