apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: crm-api
  namespace: sre-support-lab

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crm-api

  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
