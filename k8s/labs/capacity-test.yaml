apiVersion: v1
kind: Pod
metadata:
  name: capacity-test
  namespace: sre-support-lab
spec:
  containers:
    - name: capacity-test
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: "1000m"
          memory: "256Mi"
        limits:
          cpu: "1000m"
          memory: "256Mi"
